<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
  
</head>
<body>
    <STyle>
        * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: sans-serif;
    background: linear-gradient(rgb(255, 0, 212), #022ffc , #02e8f8);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.card {
    background: white;
    border-radius: 16px;
    padding: 32px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
}

h2 {
    text-align: center;
    margin-bottom: 24px;
    color: #333;
    font-weight: 600;
}

.form-group {
    margin-bottom: 18px;
}

label {
    display: block;
    font-size: 14px;
    font-weight: 500;
    color: #555;
    margin-bottom: 6px;
}

select,
input {
    width: 100%;
    padding: 12px 14px;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    font-size: 16px;
    transition: border-color 0.2s;
    background: #fafafa;
}

select:focus,
input:focus {
    outline: none;
    border-color: #667eea;
    background: white;
}

.row {
    display: flex;
    gap: 12px;
}

.row .form-group {
    flex: 1;
}

button {
    width: 100%;
    padding: 14px;
    background: #667eea;
    border: none;
    border-radius: 10px;
    color: white;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    margin-top: 8px;
}

button:hover {
    background: #5a6fd6;
}

button:active {
    transform: scale(0.98);
}

.result {
    margin-top: 20px;
    padding: 16px;
    background: #f0f4ff;
    border-radius: 10px;
    text-align: center;
    font-size: 18px;
    font-weight: 600;
    color: #333;
    min-height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    word-break: break-word;
}

.error {
    color: #e74c3c;
    font-size: 14px;
    margin-top: 6px;
    min-height: 20px;
}

.note {
    text-align: center;
    font-size: 12px;
    color: #999;
    margin-top: 16px;
}
    </STyle>
    <div class="card">
        <h2>L3 sod Currency Converter</h2>

        <div class="row">
            <div class="form-group">
                <label for="omega">From</label>
                <select id="omega">
                    <option value="USD" >USD</option>
                    <option value="EUR">EUR</option>
                    <option value="GBP">GBP</option>
                    <option value="KES">KES</option>
                    <option value="RWF">RWF</option>
                </select>
            </div>
            <div class="form-group">
                <label for="beltin">To</label>
                <select id="beltin">
                    <option value="RWF">RWF</option>
                    <option value="USD">USD</option>
                    <option value="EUR">EUR</option>
                    <option value="GBP">GBP</option>
                    <option value="KES">KES</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label for="amount">Amount</label>
            <input type="number" id="amount"  value="1">
            <div id="error" class="error"></div>
        </div>

        <button onclick="convert()">Convert</button>

        <div id="result" class="result">—</div>

    </div>

    <script>
        
        const rates = {
            USD: 1,
            EUR: 0.92,
            GBP: 0.79,
            KES: 130,
            RWF: 1310
        };

        function formatNumber(num) {
            return num.toLocaleString('en-US', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }

        function convert() {
            const from = document.getElementById('omega').value;
            const to = document.getElementById('beltin').value;
            const amountInput = document.getElementById('amount');
            const errorDiv = document.getElementById('error');
            const resultDiv = document.getElementById('result');

            errorDiv.textContent = '';
            const amount = parseFloat(amountInput.value);

            if (isNaN(amount) || amount < 0) {
                alert("Please enter a valid positive number.");
                resultDiv.textContent = '—';
                return;
            }

            
            const amountInUSD = amount / rates[from];
            const converted = amountInUSD * rates[to];

    
            const formattedSource = formatNumber(amount);
            const formattedConverted = formatNumber(converted);

            resultDiv.textContent = `${formattedSource} ${from} = ${formattedConverted} ${to}`;
        }

        document.getElementById('amount').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') convert();
        });

        convert();


    </script>
</body>
</html>
